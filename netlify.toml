# Netlify serves the generated website in site/, not the repository root.
# No build command: site/ is generated locally by `python build_site.py`
# and committed. After editing build_site.py, re-run it and commit site/.
[build]
  publish = "site"
  # Skip the deploy when nothing in site/ changed (e.g. config-only commits),
  # so those pushes don't use deploy credits. Exit 0 = skip, 1 = deploy.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/"
